# Next.js 15 (App Router) on Netlify — https://docs.netlify.com/frameworks/next-js/overview/
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  # Next.js server actions: see `maxDuration` in `src/app/dashboard/ai-agent/page.tsx`.
  # If 504 persists, raise the function timeout in Netlify (Site configuration → Functions).
